name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .

  type_check:
    name: Pyright
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Type-check the authored package
        run: python -m pyright --pythonpath "$(command -v python)"

  unit_tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q -m 'not integration'

  package_build:
    name: Build and wheel smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - name: Verify wheel in an isolated environment
        shell: bash
        run: |
          python -m venv /tmp/chef-human-wheel-check
          /tmp/chef-human-wheel-check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/chef-human-wheel-check/bin/python -m chef_human --help
          /tmp/chef-human-wheel-check/bin/chef-human --help

  ci_gate:
    name: Required CI gate
    if: ${{ always() }}
    needs: [lint, type_check, unit_tests, package_build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every required job passed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TYPE_RESULT: ${{ needs.type_check.result }}
          TEST_RESULT: ${{ needs.unit_tests.result }}
          BUILD_RESULT: ${{ needs.package_build.result }}
        run: |
          test "$LINT_RESULT" = success
          test "$TYPE_RESULT" = success
          test "$TEST_RESULT" = success
          test "$BUILD_RESULT" = success
