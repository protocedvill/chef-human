name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff and package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check chef_human tests
      - run: python -m build
      - name: Verify wheel in an isolated environment
        shell: bash
        run: |
          python -m venv /tmp/chef-human-wheel-check
          /tmp/chef-human-wheel-check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/chef-human-wheel-check/bin/python -m chef_human --help
          /tmp/chef-human-wheel-check/bin/chef-human --help

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q -m 'not integration'
