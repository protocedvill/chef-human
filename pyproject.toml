[project]
name = "chef-human"
version = "0.1.0"
description = "Experimental local-first coding agent for open-weight models"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "ollama>=0.3.0",
    "rich>=13.0",
    "click>=8.0",
    "textual>=0.60",
]

[project.optional-dependencies]
llamacpp = [
    "llama-cpp-python>=0.3.0",
]
embeddings = [
    "sentence-transformers>=3.0.0",
]
indexing = [
    "tree-sitter>=0.23,<1.0",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
]
rag = [
    "faiss-cpu>=1.14",
    "numpy>=1.25",
    "sentence-transformers>=3.0.0",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "pyright>=1.1",
]

[project.scripts]
chef-human = "chef_human.main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["docs/archive"]

[tool.pyright]
include = ["chef_human"]
exclude = ["docs/archive"]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: deterministic tests that require no live model backend",
    "integration: opt-in tests that require a live model backend",
    "integration_ollama: integration tests that require Ollama and the configured model",
    "integration_llamacpp: integration tests that require llama.cpp and a local GGUF model",
    "indexing: tests for the optional tree-sitter indexing stack",
    "rag: tests for the experimental NumPy/FAISS retrieval stack",
    "ui: tests for terminal UI adapters and Textual widgets",
]
